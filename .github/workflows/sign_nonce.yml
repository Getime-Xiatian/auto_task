name: Sign Nonce Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: pip install pycryptodome

      - name: Clone Gitee private repo
        run: |
          git clone "https://getime:${GITEE_TOKEN}@gitee.com/getime/xttools-tokens.git" gitee_repo

      - name: Restore private key
        run: |
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > rsa_private_key.pem
          chmod 600 rsa_private_key.pem

      - name: Copy sign script into repo
        run: cp sign_nonce.py gitee_repo/sign_nonce.py 2>/dev/null; :

      - name: Sign nonce and push
        run: python sign_nonce.py
